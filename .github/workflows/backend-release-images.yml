name: backend-release-images

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag o alias para las imagenes (opcional).
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: atlantia_test
          MYSQL_USER: atlantia
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, pdo_mysql, redis, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: atlantia_test
          DB_USERNAME: atlantia
          ATLANTIA_DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          CACHE_STORE: redis
          QUEUE_CONNECTION: redis
          SESSION_DRIVER: redis

      - name: Run tests
        run: php artisan test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: marketplace
            context: .
            file: ./Dockerfile
            target: production
          - image: marketplace-web
            context: .
            file: ./Dockerfile
            target: web
          - image: ml-api
            context: ./ml-service
            file: ./ml-service/docker/Dockerfile.api
            target: ""
          - image: ml-worker
            context: ./ml-service
            file: ./ml-service/docker/Dockerfile.worker
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} (target)
        if: ${{ matrix.target != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlantia/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/atlantia/${{ matrix.image }}:${{ inputs.release_tag || github.ref_name || 'manual' }}

      - name: Build and push ${{ matrix.image }} (default)
        if: ${{ matrix.target == '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlantia/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/atlantia/${{ matrix.image }}:${{ inputs.release_tag || github.ref_name || 'manual' }}
