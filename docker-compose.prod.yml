name: atlantia-prod

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - atlantia

x-php-service: &php-service
  <<: *service-defaults
  image: ${REGISTRY_IMAGE}/marketplace:${APP_IMAGE_TAG}
  env_file:
    - /opt/atlantia/shared/marketplace.env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    RUN_MIGRATIONS: "false"
    RUN_OPTIMIZE: "true"
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /usr/local/var/run:size=16m
    - /usr/local/var/log:size=16m
    - /var/www/html/bootstrap/cache:size=32m
  volumes:
    - app-storage:/var/www/html/storage

services:
  nginx:
    <<: *service-defaults
    image: nginx:1.27-alpine
    ports:
      - "${ATLANTIA_HTTP_BIND:-127.0.0.1:8080}:80"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=32m,mode=1777
    volumes:
      - ${ATLANTIA_RELEASE_PATH:-/opt/atlantia/current}:/var/www/html:ro
      - app-storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    <<: *php-service
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  worker-critical:
    <<: *php-service
    command: php artisan queue:work redis --queue=${QUEUE_CRITICAL_NAMES:-critical,checkout,payments,default} --sleep=1 --tries=3 --timeout=120 --max-time=3600
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  worker-default:
    <<: *php-service
    command: php artisan queue:work redis --queue=${QUEUE_DEFAULT_NAMES:-default,notifications,mail,ml,reports} --sleep=3 --tries=3 --timeout=180 --max-time=3600
    stop_grace_period: 3m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  scheduler:
    <<: *php-service
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    stop_grace_period: 70s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  ml-api:
    <<: *service-defaults
    image: ${REGISTRY_IMAGE}/ml-api:${APP_IMAGE_TAG}
    env_file:
      - /opt/atlantia/shared/ml.env
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 768M

  ml-worker:
    <<: *service-defaults
    image: ${REGISTRY_IMAGE}/ml-worker:${APP_IMAGE_TAG}
    env_file:
      - /opt/atlantia/shared/ml.env
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 3m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 768M

  mysql:
    <<: *service-defaults
    image: mysql:8.0
    profiles: ["stateful-local"]
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
    env_file:
      - /opt/atlantia/shared/mysql.env
    ports:
      - "${MYSQL_BIND:-127.0.0.1:3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7.2-alpine
    profiles: ["stateful-local"]
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    env_file:
      - /opt/atlantia/shared/redis.env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  meilisearch:
    <<: *service-defaults
    image: getmeili/meilisearch:v1.12
    profiles: ["stateful-local"]
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_BIND:-127.0.0.1:7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  app-storage:
  mysql-data:
  redis-data:
  meili-data:

networks:
  atlantia:
    driver: bridge
