name: atlantia-prod

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"
  networks:
    - atlantia

x-php-service: &php-service
  <<: *service-defaults
  image: ${REGISTRY_IMAGE}/marketplace:${APP_IMAGE_TAG}
  env_file:
    - /opt/atlantia/shared/marketplace.env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    SESSION_SECURE_COOKIE: "true"
    RUN_MIGRATIONS: "false"
    RUN_OPTIMIZE: "true"
  read_only: true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /usr/local/var/run:size=16m
    - /usr/local/var/log:size=16m
    - /var/www/html/bootstrap/cache:size=32m
  volumes:
    - app-storage:/var/www/html/storage

services:
  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    environment:
      ATLANTIA_DOMAIN: ${ATLANTIA_DOMAIN:?ATLANTIA_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    <<: *service-defaults
    image: ${REGISTRY_IMAGE}/marketplace-web:${APP_IMAGE_TAG}
    expose:
      - "80"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=32m,mode=1777
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    <<: *php-service
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  worker-critical:
    <<: *php-service
    command: php artisan queue:work redis --queue=${QUEUE_CRITICAL_NAMES:-critical,checkout,payments,default} --sleep=1 --tries=3 --backoff=5 --timeout=120 --memory=768 --max-jobs=1000 --max-time=3600
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  worker-default:
    <<: *php-service
    command: php artisan queue:work redis --queue=${QUEUE_DEFAULT_NAMES:-default,notifications,mail,ml,reports} --sleep=3 --tries=3 --backoff=10 --timeout=180 --memory=768 --max-jobs=1000 --max-time=3600
    stop_grace_period: 3m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M

  scheduler:
    <<: *php-service
    command: php artisan schedule:work --no-interaction
    stop_grace_period: 70s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  ml-api:
    <<: *service-defaults
    image: ${REGISTRY_IMAGE}/ml-api:${APP_IMAGE_TAG}
    env_file:
      - /opt/atlantia/shared/ml.env
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 768M

  ml-worker:
    <<: *service-defaults
    image: ${REGISTRY_IMAGE}/ml-worker:${APP_IMAGE_TAG}
    env_file:
      - /opt/atlantia/shared/ml.env
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 3m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 768M

  mysql:
    <<: *service-defaults
    image: mysql:8.4
    profiles: ["stateful-local"]
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-300}
    env_file:
      - /opt/atlantia/shared/mysql.env
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7.2-alpine
    profiles: ["stateful-local"]
    command: sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    expose:
      - "6379"
    env_file:
      - /opt/atlantia/shared/redis.env
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  meilisearch:
    <<: *service-defaults
    image: getmeili/meilisearch:v1.12
    profiles: ["stateful-local"]
    env_file:
      - /opt/atlantia/shared/search.env
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  app-storage:
  caddy-data:
  caddy-config:
  mysql-data:
  redis-data:
  meili-data:

networks:
  atlantia:
    driver: bridge
